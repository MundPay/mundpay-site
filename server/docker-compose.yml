services:
  crm-api:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: true
    environment:
      NODE_ENV: production
      PORT: 3000
      ASSIGNMENT_STATE_PATH: /app/data/assignment-state.json
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-10}
      REQUEST_BODY_LIMIT: ${REQUEST_BODY_LIMIT:-20kb}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - mundpay-crm-state:/app/data

volumes:
  mundpay-crm-state:
